<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><title>Hermes</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='50' fill='%23128c7e'/%3E%3Ctext x='50' y='68' font-size='55' text-anchor='middle' fill='white'%3EH%3C/text%3E%3C/svg%3E">
<style>
:root{--hd:#075e54;--bg:#efeae2;--out:#d9fdd3;--in:#fff;--tx:#111b21;--sub:#667781;--bar:#f0f2f5;--ac:#25d366;--tick:#53bdeb}
@media(prefers-color-scheme:dark){:root{--hd:#202c33;--bg:#0b141a;--out:#005c4b;--in:#202c33;--tx:#e9edef;--sub:#8696a0;--bar:#202c33;--tick:#53bdeb}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:15px/1.35 -apple-system,system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;overscroll-behavior:none}
header{background:var(--hd);color:#fff;padding:max(10px,env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:12px}
.av{width:40px;height:40px;border-radius:50%;background:#128c7e;display:grid;place-items:center;font-weight:700;font-size:18px}
header .t{flex:1;min-width:0}header b{display:block;font-size:16px}header small{opacity:.8;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
header button{background:none;border:0;color:#fff;font-size:20px;padding:6px;cursor:pointer}
#msgs{flex:1;overflow-y:auto;padding:10px 8px;display:flex;flex-direction:column;gap:3px;background-image:radial-gradient(rgba(128,128,128,.08) 1px,transparent 1px);background-size:18px 18px}
.m{max-width:min(85%,640px);padding:6px 8px 4px;border-radius:8px;box-shadow:0 1px .5px rgba(11,20,26,.13);white-space:pre-wrap;word-wrap:break-word;overflow-wrap:anywhere}
.m.u{align-self:flex-end;background:var(--out);border-top-right-radius:0}.m.h{align-self:flex-start;background:var(--in);border-top-left-radius:0}
.m.s{align-self:center;background:rgba(128,128,128,.18);font-size:12px;color:var(--sub)}.m.err{color:#e5484d}
.m pre{background:rgba(128,128,128,.15);padding:6px;border-radius:6px;overflow-x:auto;margin:4px 0;font:12.5px ui-monospace,Menlo,monospace;white-space:pre}
.m code{font:13px ui-monospace,Menlo,monospace}
.meta{float:right;margin:6px 0 0 10px;font-size:11px;color:var(--sub);white-space:nowrap}.meta .k{color:var(--sub)}.meta .k.r{color:var(--tick)}
.day{align-self:center;background:var(--in);color:var(--sub);font-size:12px;padding:3px 10px;border-radius:7px;margin:6px 0}
.typing{align-self:flex-start;background:var(--in);padding:8px 12px;border-radius:8px;color:var(--sub);font-size:13px}
form#f{display:flex;gap:8px;padding:8px 8px max(8px,env(safe-area-inset-bottom));background:var(--bar);align-items:flex-end}
textarea{flex:1;border:0;border-radius:20px;padding:10px 14px;font:inherit;background:var(--in);color:var(--tx);resize:none;max-height:140px;outline:0}
#send{width:44px;height:44px;border-radius:50%;border:0;background:var(--ac);color:#fff;font-size:20px;cursor:pointer;flex:none}
.chips{display:flex;gap:6px;padding:6px 8px 0;background:var(--bar);overflow-x:auto}.chips button{border:1px solid rgba(128,128,128,.35);background:var(--in);color:var(--tx);border-radius:14px;padding:3px 10px;font-size:12.5px;white-space:nowrap;cursor:pointer}
#login{position:fixed;inset:0;background:var(--bg);display:grid;place-items:center;padding:20px;z-index:9}
#login form{background:var(--in);padding:26px;border-radius:14px;width:min(360px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 4px 24px rgba(0,0,0,.15)}
#login .av{margin:0 auto;width:64px;height:64px;font-size:30px;color:#fff}#login h1{margin:0;text-align:center;font-size:20px}
#login input{padding:12px;border-radius:8px;border:1px solid rgba(128,128,128,.4);font:inherit;background:transparent;color:var(--tx)}
#login button{padding:12px;border:0;border-radius:8px;background:var(--ac);color:#fff;font:600 15px inherit;cursor:pointer}#login p{margin:0;color:#e5484d;font-size:13px;min-height:16px;text-align:center}
#mem{position:fixed;inset:0;background:var(--bg);z-index:8;display:none;flex-direction:column}
#mem.on{display:flex}#mem .bd{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
#mem textarea{border-radius:8px;min-height:180px;width:100%;flex:none;font:13px ui-monospace,Menlo,monospace;border:1px solid rgba(128,128,128,.3)}
#mem .bar{display:flex;gap:8px;align-items:center;justify-content:space-between}
#mem button.p{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 14px;cursor:pointer}
</style></head><body>
<div id="login"><form id="lf"><div class="av">H</div><h1>Hermes Remote</h1>
<input id="lu" placeholder="Username" autocomplete="username" autocapitalize="none" required>
<input id="lp" type="password" placeholder="Password" autocomplete="current-password" required>
<button>Masuk</button><p id="le"></p></form></div>
<header><div class="av">H</div><div class="t"><b>Hermes</b><small id="st">menghubungkan…</small></div>
<button id="bm" title="Memori">🧠</button><button id="bc" title="Bersihkan chat">🗑</button><button id="bo" title="Keluar">⎋</button></header>
<div id="msgs"></div>
<div class="chips" id="chips"></div>
<form id="f"><textarea id="in" rows="1" placeholder="Ketik perintah untuk Hermes…" enterkeyhint="send"></textarea><button id="send" type="submit">➤</button></form>
<div id="mem"><header><button id="mb">←</button><div class="t"><b>Memori Hermes</b><small>tersimpan di Supabase · tersinkron dua arah dengan Mac</small></div></header><div class="bd" id="mbd"></div></div>
<script>
const SB='https://bbptcxpzzvgpxqylkrmw.supabase.co/rest/v1/rpc/',KEY='sb_publishable_Ny-WHCEZ3WmcLFsPBx9QeQ_9xgo7MxR';
const $=s=>document.querySelector(s),sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t)))].map(x=>x.toString(16).padStart(2,'0')).join('');
let U='',H='',last=0,rows=new Map(),busy=false,timer=0,online=false;
const ss={get:k=>{try{return sessionStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{sessionStorage.setItem(k,v)}catch{}},del:k=>{try{sessionStorage.removeItem(k)}catch{}}};
async function rpc(n,a){const r=await fetch(SB+n,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(a)});if(!r.ok)throw new Error('http '+r.status);return r.json()}
const E={locked:'Terlalu banyak percobaan salah. Coba lagi 15 menit lagi.',wrong:'Username atau password salah.'};
async function login(u,p,quiet){const h=await sha('hermes:'+u+':'+p);let r;try{r=await rpc('hm_login',{p_u:u,p_h:h})}catch{if(!quiet)$('#le').textContent='Tidak bisa terhubung.';return false}
 if(!r.ok){if(!quiet)$('#le').textContent=E[r.err]||'Gagal.';return false}
 U=u;H=h;ss.set('hm',JSON.stringify({u,h}));$('#login').style.display='none';start();return true}
$('#lf').onsubmit=e=>{e.preventDefault();$('#le').textContent='';login($('#lu').value.trim().toLowerCase(),$('#lp').value)};
function out(){ss.del('hm');U=H='';clearTimeout(timer);$('#login').style.display='grid';$('#lp').value='';$('#msgs').innerHTML='';rows.clear();last=0}
$('#bo').onclick=out;
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function fmt(t){return esc(t).replace(/```(?:\w*\n)?([\s\S]*?)```/g,'<pre>$1</pre>').replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>')}
const hm=ts=>new Date(ts).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}),dk=ts=>new Date(ts).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long'});
function render(){const box=$('#msgs'),near=box.scrollHeight-box.scrollTop-box.clientHeight<120;let h='',day='',run=false;
 for(const m of [...rows.values()].sort((a,b)=>a.id-b.id)){const d=dk(m.ts);if(d!==day){day=d;h+=`<div class="day">${d}</div>`}
  if(m.role==='user'){const k=m.status==='pending'?'<span class="k">✓</span>':m.status==='running'?'<span class="k">✓✓</span>':'<span class="k r">✓✓</span>';if(m.status==='running')run=true;
   h+=`<div class="m u">${fmt(m.text)}<span class="meta">${hm(m.ts)} ${k}</span></div>`}
  else h+=`<div class="m h ${m.status==='error'?'err':''}">${fmt(m.text)}<span class="meta">${hm(m.ts)}</span></div>`}
 if(run)h+='<div class="typing">Hermes sedang mengerjakan… <i>(/stop untuk menghentikan)</i></div>';
 box.innerHTML=h;if(near||!box.dataset.s){box.scrollTop=box.scrollHeight;box.dataset.s=1}}
async function poll(){if(!H||busy)return;busy=true;
 try{const r=await rpc('hm_list',{p_u:U,p_h:H,p_after:last});if(!r.ok){if(r.err==='wrong')out();return}
  online=r.online;$('#st').textContent=online?'online · '+(r.info||'Mac'):'offline — agen di Mac tidak aktif';
  const up=new Map(r.upd.map(x=>[x.id,x.status]));let ch=false;
  for(const m of r.rows){rows.set(m.id,m);last=Math.max(last,m.id);ch=true}
  for(const [id,s] of up){const m=rows.get(id);if(m&&m.status!==s){m.status=s;ch=true}}
  if(ch)render()}catch{$('#st').textContent='tidak terhubung…'}finally{busy=false}
 clearTimeout(timer);timer=setTimeout(poll,document.hidden?5000:1500)}
function start(){poll()}document.addEventListener('visibilitychange',()=>{if(!document.hidden&&H){clearTimeout(timer);poll()}});
async function send(t){t=t.trim();if(!t||!H)return;$('#in').value='';$('#in').style.height='';
 try{const r=await rpc('hm_send',{p_u:U,p_h:H,p_text:t});if(!r.ok){out();return}last=Math.min(last,r.id-1);clearTimeout(timer);poll()}catch{$('#in').value=t;alert('Gagal mengirim.')}}
$('#f').onsubmit=e=>{e.preventDefault();send($('#in').value)};
$('#in').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!/Mobi|Android/i.test(navigator.userAgent)){e.preventDefault();send($('#in').value)}});
$('#in').addEventListener('input',e=>{e.target.style.height='auto';e.target.style.height=Math.min(e.target.scrollHeight,140)+'px'});
$('#chips').innerHTML=['/help','/status','/baru','/stop','/memori'].map(c=>`<button>${c}</button>`).join('');
$('#chips').onclick=e=>{if(e.target.tagName==='BUTTON')send(e.target.textContent)};
$('#bc').onclick=async()=>{if(confirm('Hapus semua riwayat chat?')){await rpc('hm_clear',{p_u:U,p_h:H});rows.clear();last=0;render();poll()}};
async function memOpen(){$('#mem').classList.add('on');const r=await rpc('hm_mem_list',{p_u:U,p_h:H});const b=$('#mbd');b.innerHTML='';
 if(!r.rows.length)b.innerHTML='<p style="color:var(--sub)">Belum ada memori tersinkron. Pastikan agen di Mac berjalan.</p>';
 for(const m of r.rows){const w=document.createElement('div');w.innerHTML=`<div class="bar"><b>${esc(m.name)}</b><span><small style="color:var(--sub)">${new Date(m.updated).toLocaleString('id-ID')}</small> <button class="p">Simpan</button></span></div><textarea></textarea>`;
  const ta=w.querySelector('textarea');ta.value=m.body;w.querySelector('button').onclick=async e=>{await rpc('hm_mem_put',{p_u:U,p_h:H,p_name:m.name,p_body:ta.value});e.target.textContent='Tersimpan ✓';setTimeout(()=>e.target.textContent='Simpan',1500)};b.append(w)}}
$('#bm').onclick=memOpen;$('#mb').onclick=()=>$('#mem').classList.remove('on');
(async()=>{try{const s=JSON.parse(ss.get('hm')||'null');if(!s)return;const r=await rpc('hm_login',{p_u:s.u,p_h:s.h});if(r.ok){U=s.u;H=s.h;$('#login').style.display='none';start()}}catch{}})();
</script></body></html>
